<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LA CABAÑA</title>
<meta name="description" content="Carta de Restaurant Cevichería La Cabaña: ceviches, chicharrones, chupes, sudados y más.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ================= HERO ================= -->
<header class="hero">
  <div class="hero-inner">
    <div class="hero-slider" id="heroSlider" aria-label="Platos de La Cabaña"></div>
    <h1 class="hero-title">
      Restauran-Cevichería 
      <span class ="subtitulo-cabana">"LA CABAÑA"</span>
    </h1>
    <p class="quote">“Disfruta, come y bebe, que la vida es breve”</p>
    <div class="hero-badges">
      <a class="badge" href="#carta">Ver la carta</a>
      <a class="badge ghost" id="locBadge" href="#contacto"></a>
    </div>
  </div>
  <svg class="waves" viewBox="0 0 2400 110" preserveAspectRatio="none" aria-hidden="true">
    <path class="wave-b" fill="rgba(230,244,250,.55)" d="M0 50 Q150 10 300 50 T600 50 T900 50 T1200 50 T1500 50 T1800 50 T2100 50 T2400 50 V110 H0Z"/>
    <path class="wave-a" fill="#e6f4fa" d="M0 70 Q150 30 300 70 T600 70 T900 70 T1200 70 T1500 70 T1800 70 T2100 70 T2400 70 V110 H0Z"/>
  </svg>
</header>

<!-- ================= NAV ================= -->
<nav class="nav" aria-label="Categorías"><div class="nav-inner" id="nav"></div></nav>

<div class="search-wrap">
  <label class="search">
    <span aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="Buscar en la carta… (ej. ceviche, arroz, pato)" autocomplete="off">
  </label>
</div>

<main id="carta">
  <div class="grid" id="menu"></div>
  <p class="empty-msg" id="empty">No encontramos ese plato 🐟 Prueba con otra palabra.</p>

  <section class="gallery" id="galeria">
    <h2>Nuestros platos</h2>
    <div class="g-grid" id="gGrid"></div>
  </section>
</main>
<div class="lightbox" id="lb"><img alt=""></div>

<footer id="contacto">
  <div class="brand">La Cabaña</div>
  <p id="addr"></p>
  <p id="hours"></p>
  <p id="fb"></p>
  <div class="events">🎉 Se alquila local para EVENTOS</div>
  <p style="font-size:.8rem;opacity:.6;margin-top:14px">Precios en soles (S/). Sujetos a cambio.</p>
</footer>

<button class="top" id="top" aria-label="Volver arriba">↑</button>


<script src="js/precios.js"></script>
<script src="js/imagenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
